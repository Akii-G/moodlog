name: Moodlog
options:
  bundleIdPrefix: io.github.akiig
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.6.3"
    CURRENT_PROJECT_VERSION: "14"
targets:
  Moodlog:
    type: application
    platform: iOS
    sources:
      - path: Moodlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akiig.moodlog
        PRODUCT_NAME: Moodlog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Moodlog/Moodlog.entitlements
        ENABLE_PREVIEWS: NO
    info:
      path: Moodlog/Info.plist
      properties:
        CFBundleDisplayName: Moodlog
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Moodlog shows your sleep and the medications you log in Health next to your mood, and can send them, with your steps and resting heart rate, to Moodlog on your PC.
        NSLocalNetworkUsageDescription: Moodlog syncs your moods with Moodlog on your PC over your home Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Moodlog/Moodlog.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
schemes:
  Moodlog:
    build:
      targets:
        Moodlog: all
