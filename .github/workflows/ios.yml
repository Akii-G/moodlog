name: iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  release:
    types: [published]   # every release gets the iPhone app attached
  workflow_dispatch:
    inputs:
      release:
        description: "Also attach the .ipa to this existing release (its tag, e.g. 2.1.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Check encryption matches the PC
        run: |
          swiftc -O -o crypto-check ios/Moodlog/SyncCrypto.swift ios/CryptoCheck/main.swift
          ./crypto-check

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Moodlog.xcodeproj -scheme Moodlog -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Moodlog.app || (grep -B2 -A6 "error:" build.log | head -200; exit 1)

      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Moodlog.app Payload/
          # A placeholder signature that carries the Health entitlement; SideStore/AltStore
          # re-sign the app with your Apple ID when installing.
          ldid -SMoodlog/Moodlog.entitlements Payload/Moodlog.app/Moodlog
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          IPA="Sottovoce-iPhone-$VERSION.ipa"
          zip -qry "$IPA" Payload
          ls -la "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Sottovoce-iPhone-ipa
          path: ios/Sottovoce-iPhone-*.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release != ''
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: gh release upload "$TAG" "$IPA" --clobber --repo "${{ github.repository }}"

      # A developer version with test buttons (Settings → "Developer: test notifications").
      # Same app id, so it installs over Sottovoce (Moodlog) and keeps your data. Never attached to releases.
      - name: Build the developer version
        if: github.event_name != 'release'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Moodlog.xcodeproj -scheme Moodlog -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEVTOOLS" \
            build | tee build-dev.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build-dev/Build/Products/Release-iphoneos/Moodlog.app || (grep -B2 -A6 "error:" build-dev.log | head -200; exit 1)
          rm -rf Payload && mkdir -p Payload
          cp -R build-dev/Build/Products/Release-iphoneos/Moodlog.app Payload/
          ldid -SMoodlog/Moodlog.entitlements Payload/Moodlog.app/Moodlog
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          zip -qry "Sottovoce-iPhone-$VERSION-dev.ipa" Payload

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: Sottovoce-iPhone-dev-ipa
          path: ios/Sottovoce-iPhone-*-dev.ipa
