name: iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
    tags: ["ios-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Moodlog.xcodeproj -scheme Moodlog -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Moodlog.app || (grep -B2 -A6 "error:" build.log | head -200; exit 1)

      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Moodlog.app Payload/
          # A placeholder signature that carries the Health entitlement; SideStore/AltStore
          # re-sign the app with your Apple ID when installing.
          ldid -SMoodlog/Moodlog.entitlements Payload/Moodlog.app/Moodlog
          zip -qry Moodlog.ipa Payload
          ls -la Moodlog.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Moodlog-ipa
          path: ios/Moodlog.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/Moodlog.ipa
